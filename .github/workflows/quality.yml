name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
      - run: pnpm quality:selftest
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - name: Budget changes need a decision record
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if git diff --name-only "$base" HEAD | grep -qx 'quality/budget.json'; then
            if ! git diff --name-only --diff-filter=A "$base" HEAD | grep -q '^docs/decisions/'; then
              echo "::error::quality/budget.json changed without a new record in docs/decisions/"
              exit 1
            fi
          fi
